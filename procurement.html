<!doctype html>
<html>
  <head>
    <title>Produce Procurement</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="navbar">
      <h3>Produce Procurement</h3>
      <a href="dashboard.html">Back</a>
    </div>

    <div class="container">
      <form>
        <div class="form-group">
          <label>Produce Name</label>
          <input type="text" />
        </div>

        <div class="form-group">
          <label>Produce Type</label>
          <input type="text" />
        </div>

        <div class="form-group">
          <label>Tonnage</label>
          <input type="number" />
        </div>

        <div class="form-group">
          <label>Cost Price</label>
          <input type="number" />
        </div>

        <div class="form-group">
          <label>Selling Price</label>
          <input type="number" />
        </div>

        <div class="form-group">
          <label>Dealer Name</label>
          <input type="text" />
        </div>

        <div class="form-group">
          <label>Dealer Contact</label>
          <input type="tel" />
        </div>

        <button>Save Procurement</button>
      </form>
    </div>
  </body>
</html>
